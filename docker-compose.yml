version: '3.8'

networks:
  dev-net:
    driver: bridge

volumes:
  postgres_data:
  node_modules:
  bun_cache:

services:
  app:
    build: 
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - bun_cache:/home/bun/.bun
    ports:
      - "3000:3000"
      - "3001:3001"
    env_file:
      - .env.local
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dev-net
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    env_file:
      - .env.local
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructures/db/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - dev-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d setest"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructures/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./infrastructures/nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - app
    networks:
      - dev-net
    restart: unless-stopped
