version: '3.8'

networks:
  dev-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  node_modules:
  bun_cache:

services:
  app:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: setest
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - bun_cache:/home/bun/.bun
    ports:
      - "3000:3000"
      - "3001:3001"
    env_file:
      - .env.local
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dev-net
    restart: unless-stopped
    develop:
      watch:
        - action: sync
          path: ./packages
          target: /app/packages
        - action: rebuild
          path: ./package.json

  db:
    image: postgres:16-alpine
    container_name: setest-db
    env_file:
      - .env.local
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructures/db/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - dev-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d setest"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  nginx:
    image: nginx:alpine
    container_name: setest-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructures/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./infrastructures/nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - app
    networks:
      - dev-net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: setest-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./infrastructures/redis/redis.conf:/usr/local/redis/redis.conf
    command: sh -c "redis-server /usr/local/redis/redis.conf"
    networks:
      - dev-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    
  adminer:
    image: adminer:latest
    container_name: setest-adminer
    ports:
      - "6543:6543"
    depends_on:
      - db
    networks:
      - dev-net
    restart: unless-stopped

